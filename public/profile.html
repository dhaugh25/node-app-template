<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CourseConnect • Profile & Preferences</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/images/sparky.png" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    main.page {
      max-width: 1000px;
      margin: 28px auto;
      padding: 0 18px;
      color: #e8e8e8;
    }
    h2 {
      color: #ffcc33;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>
  <!-- Unified top bar -->
  <header class="sitebar">
    <div class="brand">
      <img src="/images/sparky.png" alt="CourseConnect" />
      <span>CourseConnect</span>
      <span class="kicker">Profile</span>
    </div>

    <nav class="main-nav">
      <a href="/dashboard.html" class="nav-link">Dashboard</a>
      <a href="/profile.html" class="nav-link">Profile</a>
      <a href="/resources.html" class="nav-link">Resources</a>
    </nav>

    <div class="actions">
      <button id="logoutButton" class="btn warn">Log Out</button>
    </div>
  </header>

  <main class="page">
    <section class="grid">
      <article class="card half">
        <div class="card-h"><h2>Notifications</h2></div>
        <p>Control in-app/browser notifications and pause during class or exams.</p>

        <label class="row" style="margin-top:8px;">
          <input type="checkbox" id="notifToggle" />
          <span>Notifications enabled</span>
        </label>

        <div class="notif-controls">
          <input type="datetime-local" id="pauseUntilInput" />
          <button id="applyPauseBtn" type="button" class="btn">Pause until</button>
          <button id="clearPauseBtn" type="button" class="btn">Clear pause</button>
          <button id="askBrowserPermBtn" type="button" class="btn warn">Allow in browser</button>
        </div>

        <p id="nextStatus" class="sub" style="margin-top:6px;"></p>
      </article>

      <article class="card half">
        <div class="card-h"><h2>Account</h2></div>
        <p class="kicker">Basics</p>
        <p>Linked email and session info (read-only placeholder).</p>
      </article>
    </section>
  </main>

  <div id="toast" class="toast">Saved</div>

  <script src="/js/datamodel.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    // Logout handling for consistency
    document.querySelector('#logoutButton')?.addEventListener('click', () => {
      localStorage.removeItem('jwtToken');
      sessionStorage.removeItem('jwtToken');
      window.location.href = '/';
    });
  </script>
</body>
</html>
