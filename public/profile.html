<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CourseConnect • Profile & Preferences</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/images/sparky.png" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    main.page {
      max-width: 1000px;
      margin: 28px auto;
      padding: 0 18px;
      color: #e8e8e8;
    }
    h2 {
      color: #ffcc33;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }

    .field label {
      display:block;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:.04em;
      color:#94a3b8;
      margin-bottom:4px;
    }
    .field .input,
    .field textarea {
      width:100%;
    }
    .stack {
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .stack .row {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .stack .field {
      flex:1 1 200px;
    }
  </style>
</head>

<body>
  <!-- Unified top bar -->
  <header class="sitebar">
    <div class="brand">
      <img src="/images/sparky.png" alt="CourseConnect" />
      <span>CourseConnect</span>
      <span class="kicker">Profile</span>
    </div>

    <nav class="main-nav">
      <a href="/dashboard.html" class="nav-link">Dashboard</a>
      <a href="/profile.html" class="nav-link">Profile</a>
      <a href="/tutoring.html" class="nav-link active">Tutoring</a>
      <a href="/resources.html" class="nav-link">Resources</a>
      <a href="/community.html" class="nav-link">Community</a>
    </nav>

    <div class="actions">
      <button id="logoutButton" class="btn warn">Log Out</button>
    </div>
  </header>

  <main class="page">
    <section class="grid">
      <article class="card half">
        <div class="card-h"><h2>Notifications</h2></div>
        <p>Control in-app/browser notifications and pause during class or exams.</p>

        <label class="row" style="margin-top:8px;">
          <input type="checkbox" id="notifToggle" />
          <span>Notifications enabled</span>
        </label>

        <div class="notif-controls">
          <input type="datetime-local" id="pauseUntilInput" />
          <button id="applyPauseBtn" type="button" class="btn">Pause until</button>
          <button id="clearPauseBtn" type="button" class="btn">Clear pause</button>
          <button id="askBrowserPermBtn" type="button" class="btn warn">Allow in browser</button>
        </div>

        <p id="nextStatus" class="sub" style="margin-top:6px;"></p>
      </article>

            <article class="card half">
        <div class="card-h"><h2>Student Profile</h2></div>
        <p class="kicker">Basics</p>

        <form id="profileForm" class="stack">
          <div class="row">
            <div class="field">
              <label for="profileEmail">Email</label>
              <input id="profileEmail" class="input" type="email" readonly />
            </div>
            <div class="field">
              <label for="profileName">Full name</label>
              <input id="profileName" class="input" placeholder="Sparky Sun Devil" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="profileMajor">Major</label>
              <input id="profileMajor" class="input" placeholder="Information Systems" />
            </div>
            <div class="field">
              <label for="profileYear">Year</label>
              <input id="profileYear" class="input" placeholder="Sophomore" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="profileGpa">GPA</label>
              <input id="profileGpa" class="input" type="number" step="0.01" min="0" max="4.5" />
            </div>
            <div class="field">
              <label>Classes tracked in CourseConnect</label>
              <div id="profileClassCount" class="sub">Loading…</div>
            </div>
          </div>

          <div class="field">
            <label for="profileBio">About you</label>
            <textarea id="profileBio" class="input" rows="3"
              placeholder="What are you studying, and what are your goals?"></textarea>
          </div>

          <div class="row" style="justify-content: flex-end; gap:10px;">
            <span id="profileMsg" class="sub"></span>
            <button type="submit" class="btn ok">Save Profile</button>
          </div>
        </form>
      </article>

    </section>
  </main>

  <div id="toast" class="toast">Saved</div>

  <script src="/js/datamodel.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    // Logout handling for consistency
    document.querySelector('#logoutButton')?.addEventListener('click', () => {
      localStorage.removeItem('jwtToken');
      sessionStorage.removeItem('jwtToken');
      window.location.href = '/';
    });
  </script>
</body>
</html>
