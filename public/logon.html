<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CourseConnect — Sign in</title>
  <link rel="icon" href="/images/sparky.png" />
  <link rel="stylesheet" href="/css/logon.css" />
</head>
<body>
  <div class="container">
    <img src="/images/sparky.png" alt="CourseConnect" class="sparky-logo" />
    <h1>CourseConnect</h1>

    <div class="tab">
      <button class="tab-button active" id="login-tab">Log In</button>
      <button class="tab-button" id="create-account-tab">Create Account</button>
    </div>

    <form id="logon-form" class="active-form" autocomplete="on">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@asu.edu" required />
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" required />
      <label class="checkbox">
        <input type="checkbox" id="rememberMe" />
        <span>Remember me on this device</span>
      </label>
      <button type="submit" class="button">Enter</button>
    </form>

    <form id="create-account-form" autocomplete="off">
      <label for="create-email">Email</label>
      <input type="email" id="create-email" placeholder="you@asu.edu" required />
      <label for="create-password">Password</label>
      <input type="password" id="create-password" placeholder="Create a password" required />
      <button type="submit" class="button">Create account</button>
    </form>

    <p id="message" class="message"></p>
  </div>

  <script src="/js/logon.js"></script>
</body>
</html>
