<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="container">

        <!-- CONTROLS CONTAINER: header and action buttons separated -->
        <div class="controls-container" style="margin-bottom:18px;">
            <div class="header" style="display:flex; align-items:center; justify-content:space-between;">
                <h1>Your Classes</h1>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button id="refreshButton" class="button">Refresh</button>
                    <button id="logoutButton" class="button">Log Out</button>
                    <button id="notifToggleBtn" class="button">Enable Notifications</button>
                    <button id="openAddClassBtn" class="button">+ Add Class</button>
                </div>
            </div>
        </div>

        <!-- CONTENT CONTAINER: class list area -->
        <div class="content-container">
            <div id="classList" class="list-container" style="margin-top:0;"></div>
        </div>

    </div>

    <!-- ADD CLASS MODAL (hidden by default) -->
    <div id="addClassModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-backdrop" id="addModalBackdrop"></div>
      <div class="modal-panel" role="document" aria-labelledby="addClassTitle">
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>
        <h3 id="addClassTitle">Add a Class</h3>
        <form id="addClassForm" class="modal-form">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <div style="min-width:220px;">
              <label for="courseName">Course Name *</label><br />
              <input id="courseName" name="courseName" type="text" required />
            </div>

            <div style="min-width:180px;">
              <label for="subject">Subject & Number *</label><br />
              <input id="subject" name="subject" type="text" required />
            </div>
          </div>

          <div style="margin-top:8px;">
            <label for="days">Days (comma-separated) *</label><br />
            <input id="days" name="days" type="text" placeholder="Mon, Wed, Fri" required />
          </div>

          <div style="margin-top:8px; display:flex; gap:12px; align-items:center;">
            <div>
              <label for="startTime">Start time *</label><br />
              <input id="startTime" name="startTime" type="time" required />
            </div>

            <div>
              <label for="endTime">End time *</label><br />
              <input id="endTime" name="endTime" type="time" required />
            </div>
          </div>

          <div style="margin-top:12px; display:flex; gap:8px;">
            <button id="saveClassBtn" type="submit" class="button">Save</button>
            <button id="cancelAddClassBtn" type="button" class="button button-muted">Cancel</button>
          </div>

          <div id="classFormMessage" class="message" style="min-height:1.2em; margin-top:8px;"></div>
        </form>
      </div>
    </div>

    <!-- IMPORTANT: Load DataModel before dashboard.js -->
    <script src="/js/datamodel.js"></script>
    <script src="/js/dashboard.js" type="module"></script>

    <!-- keep your notification & service worker helpers as before -->
    <script type="module">
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(console.error);
      }

      // notification helpers (keep the same as your previous file)
      function isNotificationsEnabled() {
        const disabled = localStorage.getItem('notifDisabled') === 'true';
        return (typeof Notification !== 'undefined' && Notification.permission === 'granted' && !disabled);
      }
      async function enableNotifications() {
        if (typeof Notification === 'undefined') return false;
        if (Notification.permission === 'granted') {
          localStorage.setItem('notifDisabled', 'false');
          return true;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          localStorage.setItem('notifDisabled', 'false');
          return true;
        }
        return false;
      }
      function notify({ title, body, tag } = {}) {
        if (!isNotificationsEnabled()) return false;
        try {
          new Notification(title || 'CourseConnect', { body: body || '', tag: tag || 'courseconnect' });
          return true;
        } catch (e) { console.error('notify error:', e); return false; }
      }

      // expose to global
      window.isNotificationsEnabled = isNotificationsEnabled;
      window.enableNotifications = enableNotifications;
      window.notify = notify;
    </script>
</body>
</html>
