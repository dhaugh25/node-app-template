<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Users</h1>
            <div>
                <button id="refreshButton">Refresh List</button>
                <button id="logoutButton">Log Out</button>
                <!-- New: notifications -->
                <button id="notifToggleBtn">Enable Notifications</button>
                <!-- Add Class button -->
                <div class="add-class-area">
                  <button id="openAddClassBtn" class="button">+ Add Class</button>
                </div>

                <!-- Add Class form (hidden by default) -->
                <div id="addClassFormContainer" class="container" style="display:none; margin-top:20px;">
                  <h3>Add a class</h3>
                  <form id="addClassForm">
                    <label for="courseName">Course name *</label>
                    <input id="courseName" name="courseName" type="text" required />

                    <label for="subject">Subject *</label>
                    <input id="subject" name="subject" type="text" required />

                    <label for="days">Days (comma-separated) *</label>
                    <input id="days" name="days" type="text" placeholder="Mon,Wed,Fri" required />

                    <label for="startTime">Start time *</label>
                    <input id="startTime" name="startTime" type="time" required />

                    <label for="endTime">End time *</label>
                    <input id="endTime" name="endTime" type="time" required />

                    <div style="margin-top:10px;">
                      <button id="saveClassBtn" type="submit" class="button">Save</button>
                      <button id="cancelAddClassBtn" type="button" class="button" style="background:#888;">Cancel</button>
                    </div>

                    <div id="classFormMessage" class="message" style="min-height:1.2em;"></div>
                  </form>
                </div>
            </div>
        </div>
        <div class="user-list" id="userList"></div>
    </div>

    <!-- IMPORTANT: Load DataModel before dashboard.js -->
    <script src="/js/datamodel.js"></script>
    <script src="/js/dashboard.js" type="module"></script>

    <script type="module">
      // Register SW
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(console.error);
      }

      // ---- Local, gated notifications (no external import)
      function isNotificationsEnabled() {
        const disabled = localStorage.getItem('notifDisabled') === 'true';
        return (typeof Notification !== 'undefined' && Notification.permission === 'granted' && !disabled);
      }

      async function enableNotifications() {
        if (typeof Notification === 'undefined') return false;
        if (Notification.permission === 'granted') {
          localStorage.setItem('notifDisabled', 'false');
          return true;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          localStorage.setItem('notifDisabled', 'false');
          return true;
        }
        return false;
      }

      function notify({ title, body, tag } = {}) {
        if (!isNotificationsEnabled()) return false;
        try {
          new Notification(title || 'CourseConnect', {
            body: body || '',
            tag: tag || 'courseconnect'
          });
          return true;
        } catch (e) {
          console.error('notify error:', e);
          return false;
        }
      }

      // === HARD KILL SWITCH: intercept any direct new Notification(...) calls ===
      (() => {
        if (typeof window.Notification === 'function') {
          const NativeNotification = window.Notification;
          function GuardedNotification(title, options) {
            const disabled = localStorage.getItem('notifDisabled') === 'true';
            // If disabled, suppress and log instead of showing a popup
            if (disabled) {
              console.warn('Notification suppressed (disabled):', title, options);
              return; // do nothing
            }
            return new NativeNotification(title, options);
          }
          // Preserve API surface
          GuardedNotification.requestPermission = NativeNotification.requestPermission.bind(NativeNotification);
          Object.defineProperty(GuardedNotification, 'permission', {
            get() { return NativeNotification.permission; }
          });
          // Override global
          window.Notification = GuardedNotification;
        }
      })();

      // Expose gated helpers globally so all scripts use them
      window.isNotificationsEnabled = isNotificationsEnabled;
      window.enableNotifications = enableNotifications;
      window.notify = notify;

      const notifToggleBtn = document.getElementById("notifToggleBtn");

      // Derive initial state from permission + persisted flag
      function computeEnabled() {
        const disabled = localStorage.getItem("notifDisabled") === "true";
        return (typeof Notification !== "undefined" &&
                Notification.permission === "granted" &&
                !disabled);
      }

      let notificationsEnabled = computeEnabled();
      if (notifToggleBtn) {
        notifToggleBtn.textContent = notificationsEnabled ? "Disable Notifications" : "Enable Notifications";
      }

      // Keep SW in sync (so push notifications also respect the toggle)
      async function syncSWState() {
        const reg = await navigator.serviceWorker?.ready.catch(() => null);
        reg?.active?.postMessage({ type: "NOTIF_STATE", disabled: !notificationsEnabled });
      }
      syncSWState();

      // Toggle handler
      notifToggleBtn?.addEventListener("click", async () => {
        if (!notificationsEnabled) {
          const ok = await enableNotifications();
          if (ok) {
            notificationsEnabled = true;
            localStorage.setItem("notifDisabled", "false");
            notifToggleBtn.textContent = "Disable Notifications";
            window.notify({ title: "Notifications enabled", body: "You’ll get alerts from the app." });
            syncSWState();
          }
        } else {
          notificationsEnabled = false;
          localStorage.setItem("notifDisabled", "true");
          notifToggleBtn.textContent = "Enable Notifications";
          // It's okay to show a one-time confirmation here
          if (Notification.permission === "granted") {
            window.notify({ title: "Notifications disabled", body: "You will not receive alerts until re-enabled." });
          }
          syncSWState();
        }
      });

      // Optional greet ONLY if enabled
      if (isNotificationsEnabled()) {
        window.notify({ title: "Welcome back!", body: "You’re signed in." });
      }
    </script>
</body>
</html>
