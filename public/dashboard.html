<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CourseConnect — Dashboard</title>
  <link rel="icon" href="/images/sparky.png" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <!-- Top bar -->
<header class="sitebar">
  <div class="brand">
    <img src="/images/sparky.png" alt="CourseConnect" />
    <span>CourseConnect</span>
    <span class="kicker">Dashboard</span>
  </div>

  <!-- Navigation links (styled to look like the Refresh button) -->
  <nav class="main-nav">
    <a href="/dashboard.html" class="btn nav-link" role="button">Dashboard</a>
    <a href="/profile.html" class="btn nav-link" role="button">Profile</a>
    <a href="/resources.html" class="btn nav-link" role="button">Resources</a>
  </nav>

  <!-- Dashboard-specific buttons -->
  <div class="actions">
    <button id="logoutButton" class="btn warn">Log Out</button>
  </div>
</header>

  <!-- NOTE: removed the duplicate nav bar that used to appear below the header -->

  <main class="container">
    <!-- Left: Study System / Classes -->
    <section class="card">
      <h2>Study Planner</h2>
      <p class="sub">Add your classes and keep them in view.</p>

      <form id="classForm">
        <div class="form-grid">
          <input class="input" id="course_name" placeholder="Course name (e.g., CIS 440)" required />
          <input class="input" id="subject" placeholder="Subject (e.g., Info Systems)" required />
          <select id="days" class="input" required>
            <option value="">Days</option>
            <option>M/W/F</option><option>T/Th</option><option>M/T/W/Th/F</option><option>iCourse</option>
          </select>
          <div class="row" style="gap:10px">
            <input class="input" id="start_time" type="time" required/>
            <input class="input" id="end_time" type="time" required/>
          </div>
        </div>
        <div class="row">
          <button class="btn ok" type="submit">Add Class</button>
          <span id="classMsg" class="sub"></span>
          <div class="right row">
            <span class="sub">Quick notify on add</span>
            <div id="notifSwitch" class="switch" role="switch" aria-label="Notifications toggle" tabindex="0" data-on="false"></div>
          </div>
        </div>
      </form>

      <table class="table" id="classesTable">
        <thead>
          <tr>
            <th>Course</th><th>Subject</th><th>Days</th><th>Start</th><th>End</th>
          </tr>
        </thead>
        <tbody id="classesBody"></tbody>
      </table>
    </section>

    <!-- Right: People + Notification controls -->
    <aside class="card">
      <h2>People</h2>
      <p class="sub">Authorized users in the system.</p>
      <div id="userList" class="user-list"></div>

      <hr style="border-color:rgba(255,255,255,.08); margin:14px 0" />

      <h2>Notifications</h2>
      <p class="sub">Toggle app/browser notifications.</p>
      <div class="notif-controls">
        <button id="askBrowserPermBtn" class="btn brand">Allow in browser</button>
        <button id="testNotifBtn" class="btn">Test</button>
      </div>
      <p id="notifState" class="sub" style="margin-top:8px"></p>
    </aside>
  </main>

  <div id="toast" class="toast">Saved</div>

  <script src="/js/datamodel.js"></script>
  <script src="/js/dashboard.js" type="module"></script>

  <!-- Service worker + gated Notification helpers -->
  <script type="module">
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(console.error);
    }

    function isNotificationsEnabled() {
      const disabled = localStorage.getItem('notifDisabled') === 'true';
      return (typeof Notification !== 'undefined' && Notification.permission === 'granted' && !disabled);
    }
    async function enableNotifications() {
      if (typeof Notification === 'undefined') return false;
      if (Notification.permission === 'granted') {
        localStorage.setItem('notifDisabled','false'); return true;
      }
      const perm = await Notification.requestPermission();
      if (perm === 'granted'){ localStorage.setItem('notifDisabled','false'); return true;}
      return false;
    }
    function notify({title, body, tag}={}) {
      if (!isNotificationsEnabled()) return false;
      try{ new Notification(title||'CourseConnect',{body: body||'', tag: tag||'courseconnect'}); return true; }
      catch(e){ console.error(e); return false; }
    }

    window.isNotificationsEnabled = isNotificationsEnabled;
    window.enableNotifications = enableNotifications;
    window.notify = notify;
  </script>
</body>
</html>
